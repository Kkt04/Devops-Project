name: CI/CD Pipeline

on:
push:
branches: ["main"]
pull_request:
branches: ["main"]
workflow_dispatch:

env:
ECR_REPOSITORY: artisan-hub-backend

jobs:

# ============================================================

# PHASE 1 — SERVER TESTS

# ============================================================

test-server:
name: Phase 1 - Server Tests
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm
      cache-dependency-path: server/package-lock.json

  - name: Install dependencies
    working-directory: server
    run: npm ci --legacy-peer-deps

  - name: Run tests
    working-directory: server
    run: npm test -- --coverage --forceExit
```

# ============================================================

# PHASE 1 — CLIENT TESTS

# ============================================================

test-client:
name: Phase 1 - Client Tests
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm
      cache-dependency-path: client/package-lock.json

  - name: Install dependencies
    working-directory: client
    run: npm ci --legacy-peer-deps

  - name: Run tests
    working-directory: client
    run: npm run test
```

# ============================================================

# PHASE 2 — TERRAFORM VALIDATION

# ============================================================

terraform:
name: Phase 2 - Terraform Validation
runs-on: ubuntu-latest
needs: [test-server, test-client]

```
defaults:
  run:
    working-directory: terraform

steps:
  - uses: actions/checkout@v4

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: "1.6.0"

  - name: Terraform Init
    run: terraform init

  - name: Terraform Format Check
    run: terraform fmt -check
    continue-on-error: true

  - name: Terraform Validate
    run: terraform validate

  - name: Terraform Plan (Simulation Mode)
    run: terraform plan -no-color

  - name: Terraform Success
    run: echo "Terraform validation completed successfully"
```

# ============================================================

# PHASE 3 — DOCKER BUILD

# ============================================================

build-and-push:
name: Phase 3 - Docker Build
runs-on: ubuntu-latest
needs: terraform

```
outputs:
  image_uri: ${{ steps.build.outputs.image_uri }}

steps:
  - uses: actions/checkout@v4

  - name: Build Docker image
    id: build
    run: |
      IMAGE_TAG=${{ github.sha }}

      docker build \
        -t $ECR_REPOSITORY:$IMAGE_TAG \
        -t $ECR_REPOSITORY:latest \
        .

      echo "image_uri=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      echo "Docker image built successfully"
```


deploy:
name: Phase 4 - Simulated Deployment
runs-on: ubuntu-latest
needs: build-and-push

```
steps:
  - name: Deployment Simulation
    run: |
      echo "Deployment Stage"
      echo "Image deployed successfully (simulation mode)"
      echo "Image URI:"
      echo "${{ needs.build-and-push.outputs.image_uri }}"
      echo "Application is LIVE"
```
