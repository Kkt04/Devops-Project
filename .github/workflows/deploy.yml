# ─────────────────────────────────────────────────────────────
# ArtisanHub — CI/CD Pipeline
# ─────────────────────────────────────────────────────────────
# Workflow Order:
#   Push to main → Tests → Terraform → Docker Build & Push
#   → Deploy to ECS
# ─────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_NAME: artisan-hub-production-backend
  ECS_CLUSTER_NAME: artisan-hub-production-cluster
  ECS_SERVICE_NAME: artisan-hub-production-service

# ─────────────────────────────────────────────────────────────
# PHASE 1 — Testing
# ─────────────────────────────────────────────────────────────
jobs:
  test:
    name: "Phase 1 — Run Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run server tests (Jest)
        run: |
          cd server
          npm test

      - name: Install client dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Run client tests (Vitest)
        run: |
          cd client
          npx vitest run

      - name: Lint client
        run: |
          cd client
          npm run lint

      - name: Build client
        run: |
          cd client
          npm run build

# ─────────────────────────────────────────────────────────────
# PHASE 2 — Infrastructure (Terraform)
# ─────────────────────────────────────────────────────────────
  terraform:
    name: "Phase 2 — Terraform"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing AWS resources into state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"

          echo "Importing existing resources (errors are safe if resource doesn't exist)..."

          # Import S3 bucket if exists
          aws s3api head-bucket --bucket "artisan-hub-production-artifacts-${ACCOUNT_ID}" 2>/dev/null && \
            terraform import aws_s3_bucket.artifacts "artisan-hub-production-artifacts-${ACCOUNT_ID}" 2>/dev/null || true

          # Import S3 versioning
          terraform import aws_s3_bucket_versioning.artifacts_versioning "artisan-hub-production-artifacts-${ACCOUNT_ID}" 2>/dev/null || true

          # Import S3 encryption
          terraform import aws_s3_bucket_server_side_encryption_configuration.artifacts_encryption "artisan-hub-production-artifacts-${ACCOUNT_ID}" 2>/dev/null || true

          # Import S3 public access block
          terraform import aws_s3_bucket_public_access_block.artifacts_public_block "artisan-hub-production-artifacts-${ACCOUNT_ID}" 2>/dev/null || true

          # Import ECR repository if exists
          aws ecr describe-repositories --repository-names artisan-hub-production-backend --region $REGION 2>/dev/null && \
            terraform import aws_ecr_repository.backend artisan-hub-production-backend 2>/dev/null || true

          # Import ECS cluster if exists
          aws ecs describe-clusters --clusters artisan-hub-production-cluster --region $REGION 2>/dev/null && \
            terraform import aws_ecs_cluster.main artisan-hub-production-cluster 2>/dev/null || true

          # Import CloudWatch log group if exists
          aws logs describe-log-groups --log-group-name-prefix "/ecs/artisan-hub-production" --region $REGION 2>/dev/null && \
            terraform import aws_cloudwatch_log_group.ecs "/ecs/artisan-hub-production" 2>/dev/null || true

          # Import Security Group if exists
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=artisan-hub-production-ecs-sg" \
            --region $REGION \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            terraform import aws_security_group.ecs $SG_ID 2>/dev/null || true
          fi

          echo "Import step complete"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply (Infrastructure only)
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: tf-outputs
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "service_name=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT || echo "service_name=" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Upload Terraform state
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate

# ─────────────────────────────────────────────────────────────
# PHASE 3 — Docker Build & Push to ECR
# ─────────────────────────────────────────────────────────────
  docker-build:
    name: "Phase 3 — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ECR Repository URL
        id: ecr-info
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPO_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ECR URL: $ECR_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build React client
        run: |
          cd client
          npm ci --legacy-peer-deps
          npm run build
          echo "✅ Client built successfully"

      - name: Copy client build to server
        run: |
          mkdir -p server/public
          cp -r client/dist/* server/public/
          echo "✅ Client build copied to server/public/"

      - name: Build Docker image
        run: |
          ECR_URL="${{ steps.ecr-info.outputs.ecr_url }}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile \
            -t artisan-hub:${{ github.sha }} \
            -t artisan-hub:latest \
            -t $ECR_URL:${{ github.sha }} \
            -t $ECR_URL:latest \
            .

      - name: Push image to ECR
        run: |
          ECR_URL="${{ steps.ecr-info.outputs.ecr_url }}"
          docker push $ECR_URL:${{ github.sha }}
          docker push $ECR_URL:latest
          echo "✅ Image pushed to ECR successfully"

# ─────────────────────────────────────────────────────────────
# PHASE 4 — Deploy to ECS Fargate
# ─────────────────────────────────────────────────────────────
  deploy-ecs:
    name: "Phase 4 — Deploy to ECS"
    runs-on: ubuntu-latest
    needs: [terraform, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: terraform/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Get ECR Repository URL
        id: ecr-info
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPO_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ECR URL: $ECR_URL"

      - name: Deploy ECS service (Terraform)
        working-directory: terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform apply -auto-approve \
            -var="deploy_ecs_service=true" \
            -var="container_image=${{ steps.ecr-info.outputs.ecr_url }}:${{ github.sha }}" \
            -var="ecs_execution_role_arn=arn:aws:iam::${ACCOUNT_ID}:role/LabRole"

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Get public IP and verify health
        run: |
          CLUSTER="${{ env.ECS_CLUSTER_NAME }}"
          SERVICE="${{ env.ECS_SERVICE_NAME }}"

          # Wait for task to be running
          sleep 30

          TASK_ARN=$(aws ecs list-tasks \
            --cluster $CLUSTER \
            --service-name $SERVICE \
            --region ${{ secrets.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)

          echo "Task ARN: $TASK_ARN"

          if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
            ENI_ID=$(aws ecs describe-tasks \
              --cluster $CLUSTER \
              --tasks $TASK_ARN \
              --region ${{ secrets.AWS_REGION }} \
              --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
              --output text)

            PUBLIC_IP=$(aws ec2 describe-network-interfaces \
              --network-interface-ids $ENI_ID \
              --region ${{ secrets.AWS_REGION }} \
              --query 'NetworkInterfaces[0].Association.PublicIp' \
              --output text)

            echo "Public IP: $PUBLIC_IP"

            # Wait for app to start
            sleep 30

            echo "Verifying health endpoint..."
            curl -f "http://${PUBLIC_IP}:5001/api/health"
            echo ""
            echo "✅ App is live at: http://${PUBLIC_IP}:5001"
          else
            echo "⚠️ No running tasks found"
            exit 1
          fi
