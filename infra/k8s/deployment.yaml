apiVersion: apps/v1
kind: Deployment
metadata:
  name: artisan-hub-api
  namespace: artisan-hub
  labels:
    app: artisan-hub-api
    environment: production
spec:
  # ── Rubric: minimum 2 replicas ──
  replicas: 2
  selector:
    matchLabels:
      app: artisan-hub-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: artisan-hub-api
        environment: production
    spec:
      # Run as non-root for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: artisan-hub-api
          # IMAGE_PLACEHOLDER is replaced by the CI/CD pipeline via sed
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5001"
          # ── Rubric: resource limits ──
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # ── Rubric: liveness probe ──
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Rubric: readiness probe ──
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
