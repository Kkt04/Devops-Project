services:
  - type: web
    name: artisan-hub-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  - type: static
    name: artisan-hub-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: artisan-hub-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html